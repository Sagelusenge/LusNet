services:
  - type: web
    name: lwasiva-net-api
    env: node
    plan: free
    buildCommand: npm install && npm run frontend:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: mysql-a72aeaf-sagelusenge-7c93.a.aivencloud.com
      - key: DB_PORT
        value: 18531
      - key: DB_USER
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_FROM_NUMBER
        value: "243980208012"
      - key: WEB_PUSH_SUBJECT
        value: mailto:admin@lwasiva.net
      - key: WEB_PUSH_PUBLIC_KEY
        value: BNVVqLNisEzsvoBPt4ZS06MpNkr0po37y5nZ5iv2YAH5nvOH1doSasFc_fHJbro0w85jr_Xol5hAL0NXylWf0Ng
      - key: WEB_PUSH_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_DEADLINE_ALERTS
        value: "true"
      - key: SMTP_ENABLED
        value: "true"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: sagelusenge@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: LWASIVA_NET <sagelusenge@gmail.com>
      - key: SMTP_REPLY_TO
        value: sagelusenge@gmail.com
      - key: ADMIN_NOTIFICATION_EMAIL
        value: sagelusenge@gmail.com

  - type: static
    name: lwasiva-net-web
    buildCommand: npm install && npm run frontend:build
    staticPublishPath: dist/frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lwasiva-net-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
